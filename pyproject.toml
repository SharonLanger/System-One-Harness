[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-context-router"
version = "0.1.0"
requires-python = ">=3.11"
description = "Reusable mock-first Laya decisions and bounded TypeScript context"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
laya_context_router = ["building_blocks/questions/*/*.json", "building_blocks/questions/*/*.md"]
