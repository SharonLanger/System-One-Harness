<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc"><title id="title">Small decisions. Reusable blocks.</title><desc id="desc">Laya question blocks and deterministic tools compose into Python flows. Related flows can be packaged behind a Claude Code plugin.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="760" height="390" rx="20" fill="#0f172a"/><g font-family="Arial, sans-serif"><text x="380" y="38" text-anchor="middle" fill="#7dd3fc" font-size="16">COMPOSE · REUSE · CONNECT</text><rect x="40" y="65" width="320" height="80" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="200" y="94" text-anchor="middle" fill="#e2e8f0" font-size="20">Laya question blocks</text><text x="200" y="118" text-anchor="middle" fill="#cbd5e1" font-size="15">Structured answers + explicit rules</text><rect x="400" y="65" width="320" height="80" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/><text x="560" y="94" text-anchor="middle" fill="#e2e8f0" font-size="20">Deterministic tools</text><text x="560" y="118" text-anchor="middle" fill="#cbd5e1" font-size="15">Inspect files · extract source</text><path d="M200 145 V175 H380 V200" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 145 V175 H380" fill="none" stroke="#94a3b8" stroke-width="2"/><rect x="200" y="200" width="360" height="72" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/><text x="380" y="229" text-anchor="middle" fill="#e2e8f0" font-size="20">Python flows</text><text x="380" y="253" text-anchor="middle" fill="#cbd5e1" font-size="15">Combine blocks for a specific job</text><path d="M380 272 V305" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="200" y="305" width="360" height="64" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/><text x="380" y="334" text-anchor="middle" fill="#e2e8f0" font-size="20">Claude Code plugin</text><text x="380" y="358" text-anchor="middle" fill="#cbd5e1" font-size="15">Package the hook integration</text></g></svg>
