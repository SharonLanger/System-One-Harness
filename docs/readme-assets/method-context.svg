<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 930" role="img" aria-labelledby="title desc"><title id="title">Method-context proof of concept</title><desc id="desc">Current successful route from a UserPromptSubmit hook through file resolution, action classification, outline, method selection, extraction and session checks to context returned to Claude Code. Skips and failures produce no added context.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="760" height="930" rx="20" fill="#0f172a"/><g font-family="Arial, sans-serif"><text x="380" y="35" text-anchor="middle" fill="#7dd3fc" font-size="16">CURRENT PROOF OF CONCEPT · SUCCESS PATH</text><rect x="60" y="60" width="640" height="74" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="380" y="89" text-anchor="middle" fill="#e2e8f0" font-size="20">Hook input → gateway → dispatcher</text><text x="380" y="113" text-anchor="middle" fill="#cbd5e1" font-size="15">Validate UserPromptSubmit and its project context</text><path d="M380 134 V160" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="160" width="640" height="74" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/><text x="380" y="189" text-anchor="middle" fill="#e2e8f0" font-size="20">Resolve one eligible TypeScript file</text><text x="380" y="213" text-anchor="middle" fill="#cbd5e1" font-size="15">Deterministic path resolution</text><path d="M380 234 V260" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="260" width="640" height="74" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="380" y="289" text-anchor="middle" fill="#e2e8f0" font-size="20">Classify the requested action</text><text x="380" y="313" text-anchor="middle" fill="#cbd5e1" font-size="15">Laya block: explain or generate tests</text><path d="M380 334 V360" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="360" width="640" height="74" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/><text x="380" y="389" text-anchor="middle" fill="#e2e8f0" font-size="20">Build a source outline</text><text x="380" y="413" text-anchor="middle" fill="#cbd5e1" font-size="15">Deterministic TypeScript helper</text><path d="M380 434 V460" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="460" width="640" height="74" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="380" y="489" text-anchor="middle" fill="#e2e8f0" font-size="20">Select one method</text><text x="380" y="513" text-anchor="middle" fill="#cbd5e1" font-size="15">Laya block: candidate selection + decision rules</text><path d="M380 534 V560" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="560" width="640" height="74" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/><text x="380" y="589" text-anchor="middle" fill="#e2e8f0" font-size="20">Extract and verify source</text><text x="380" y="613" text-anchor="middle" fill="#cbd5e1" font-size="15">Add direct call locations when available and within budget</text><path d="M380 634 V660" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="660" width="640" height="74" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/><text x="380" y="689" text-anchor="middle" fill="#e2e8f0" font-size="20">Check session history</text><text x="380" y="713" text-anchor="middle" fill="#cbd5e1" font-size="15">Suppress repeated enrichment since the last compaction</text><path d="M380 734 V760" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="760" width="640" height="74" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/><text x="380" y="789" text-anchor="middle" fill="#e2e8f0" font-size="20">Return context to Claude Code</text><text x="380" y="813" text-anchor="middle" fill="#cbd5e1" font-size="15">Gateway writes hookSpecificOutput.additionalContext</text><text x="380" y="900" text-anchor="middle" fill="#cbd5e1" font-size="17">Ineligible, undecided, duplicate or failed → no added context</text></g></svg>
