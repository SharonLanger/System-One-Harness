<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" role="img" aria-labelledby="title desc"><title id="title">Planned event routing</title><desc id="desc">Planned model: Claude Code hook events enter a gateway and dispatcher. Event 1 invokes Flow A, Event 2 invokes Flow B, and Event 3 invokes A and B concurrently. Concurrent routing is not implemented yet.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="760" height="550" rx="20" fill="#0f172a"/><g font-family="Arial, sans-serif"><text x="380" y="35" text-anchor="middle" fill="#fbbf24" font-size="16">PLANNED ROUTING MODEL</text><rect x="230" y="55" width="300" height="65" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="380" y="84" text-anchor="middle" fill="#e2e8f0" font-size="20">Claude Code hook events</text><path d="M380 120 V145" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="230" y="145" width="300" height="65" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="380" y="174" text-anchor="middle" fill="#e2e8f0" font-size="20">Gateway</text><path d="M380 210 V235" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="230" y="235" width="300" height="65" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="380" y="264" text-anchor="middle" fill="#e2e8f0" font-size="20">Event dispatcher</text><path d="M380 300 V325 H130 V350" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M380 300 V350" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M380 300 V325 H630 V350" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="350" width="180" height="60" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="130" y="379" text-anchor="middle" fill="#e2e8f0" font-size="20">Event 1</text><rect x="290" y="350" width="180" height="60" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="380" y="379" text-anchor="middle" fill="#e2e8f0" font-size="20">Event 2</text><rect x="540" y="350" width="180" height="60" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="630" y="379" text-anchor="middle" fill="#e2e8f0" font-size="20">Event 3</text><path d="M130 410 V455" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M380 410 V455" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M630 410 V435 H580 V455" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M630 410 V435 H680 V455" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="455" width="180" height="60" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="130" y="484" text-anchor="middle" fill="#e2e8f0" font-size="20">Flow A</text><rect x="290" y="455" width="180" height="60" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="380" y="484" text-anchor="middle" fill="#e2e8f0" font-size="20">Flow B</text><rect x="540" y="455" width="80" height="60" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="580" y="484" text-anchor="middle" fill="#e2e8f0" font-size="20">A</text><rect x="640" y="455" width="80" height="60" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="680" y="484" text-anchor="middle" fill="#e2e8f0" font-size="20">B</text><text x="630" y="538" text-anchor="middle" fill="#fbbf24" font-size="15">Run concurrently</text></g></svg>
