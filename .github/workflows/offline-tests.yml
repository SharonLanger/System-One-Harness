name: Offline tests
on: [pull_request, push]
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: typescript-helper/package-lock.json
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e '.[test]'
      - run: npm ci --prefix typescript-helper
      - run: npm run build --prefix typescript-helper
      - run: python -m pytest -q
      - run: npm test --prefix typescript-helper
      - run: python scripts/check_repository_hygiene.py
